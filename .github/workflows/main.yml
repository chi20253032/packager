name: Packager - Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: packager-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and package standalone HTML
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build single-file mobile Packager
        run: npm run build-standalone-prod

      - name: Verify standalone output
        run: |
          test -s dist/standalone.html
          echo "Standalone HTML size:"
          wc -c dist/standalone.html

      - name: Upload standalone HTML
        uses: actions/upload-artifact@v6
        with:
          name: packager-standalone-mobile
          path: dist/standalone.html
          if-no-files-found: error
          retention-days: 14

name: Packager - Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: packager-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and package standalone HTML
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build single-file mobile Packager
        run: npm run build-standalone-prod

      - name: Verify standalone output
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('dist/standalone.html', 'utf8');
          if (!html.trim()) throw new Error('Standalone HTML is empty.');
          // Check document tags, not HTML-like strings inside bundled JavaScript.
          const markup = html.replace(/(<script\\b[^>]*>)[\\s\\S]*?(<\\/script\\s*>)/gi, '$1$2');
          const tags = markup.match(/<(?:script|link)\\b[^>]*>/gi) || [];
          const externalScripts = tags.filter(tag => /^<script\\b/i.test(tag) && /\\bsrc\\s*=/i.test(tag));
          const externalStyles = tags.filter(tag => /^<link\\b/i.test(tag) && /\\brel\\s*=\\s*(["'])[^"']*\\bstylesheet\\b[^"']*\\1/i.test(tag) && /\\bhref\\s*=/i.test(tag));
          if (externalScripts.length || externalStyles.length) {
            throw new Error('External script or stylesheet references remain: ' + [...externalScripts, ...externalStyles].join(' | '));
          }
          console.log('Standalone HTML size: ' + Buffer.byteLength(html) + ' bytes');
          NODE

      - name: Upload standalone HTML
        uses: actions/upload-artifact@v6
        with:
          name: packager-standalone-mobile
          path: dist/standalone.html
          if-no-files-found: error
          retention-days: 14
